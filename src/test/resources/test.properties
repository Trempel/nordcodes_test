# Настройки тестового окружения. Любой параметр можно переопределить через -D<имя>=<значение>

# true  - тесты сами запускают приложение из jar-файла на свободном порту (рекомендуется)
# false - тесты работают с уже запущенным приложением (app.url), мок поднимается на mock.port
app.start=true
app.jar=internal-0.0.1-SNAPSHOT.jar
app.secret=qazWSXedc
app.startup.timeout.sec=90

# Используются только при app.start=false
app.url=http://localhost:8080
mock.port=8888
